<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — RepairShop</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        color: #e5e7eb;
        background: #1e1b4b;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    nav {
        position: sticky;
        top: 0;
        background: rgba(30, 27, 75, 0.85);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        padding: 16px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
    }

    .logo {
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .logo span { color: #a78bfa; }
    .logo::before { content: "🔧"; font-size: 24px; }

    .nav-links {
        display: flex;
        gap: 26px;
        align-items: center;
        list-style: none;
    }

    .nav-links a {
        color: #c4b5fd;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        transition: color 0.2s;
    }

    .nav-links a:hover { color: #ffffff; }

    .main {
        flex: 1;
        padding: 60px 8%;
        background: radial-gradient(ellipse at top right, #3b2d7a 0%, transparent 55%),
                    radial-gradient(ellipse at bottom left, #312e81 0%, transparent 55%),
                    linear-gradient(135deg, #1e1b4b 0%, #2e1065 100%);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .form-card {
        background: rgba(30, 27, 75, 0.6);
        border: 1px solid rgba(139, 92, 246, 0.25);
        border-radius: 24px;
        padding: 45px 40px;
        width: 100%;
        max-width: 560px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(16px);
    }

    .form-card h1 {
        font-size: 30px;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 6px;
    }

    .form-card h1 span {
        background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .form-card .subtitle {
        color: #c4b5fd;
        font-size: 14.5px;
        margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }

    .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #c4b5fd;
        margin-bottom: 6px;
    }

    .field label span { color: #a78bfa; }

    .field input,
    .field textarea {
        width: 100%;
        padding: 13px 16px;
        background: rgba(139, 92, 246, 0.08);
        border: 1.5px solid rgba(139, 92, 246, 0.25);
        border-radius: 12px;
        color: #ffffff;
        font-size: 14.5px;
        font-family: inherit;
        outline: none;
        transition: all 0.2s;
    }

    .field input::placeholder,
    .field textarea::placeholder { color: #7c7a9c; }

    .field input:focus,
    .field textarea:focus {
        border-color: #a78bfa;
        background: rgba(139, 92, 246, 0.15);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
    }

    .field textarea { resize: vertical; min-height: 70px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn-submit {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        color: #ffffff;
        border: none;
        border-radius: 30px;
        font-size: 15.5px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.25s;
        margin-top: 10px;
        box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(139, 92, 246, 0.6);
    }

    .btn-submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }

    .error-msg {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 13.5px;
        margin-bottom: 20px;
        display: none;
    }

    .error-msg.show { display: block; }

    .success-msg {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #6ee7b7;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 13.5px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
    }

    .success-msg.show { display: block; }

    .bottom-link {
        text-align: center;
        margin-top: 22px;
        font-size: 14px;
        color: #a5b4fc;
    }

    .bottom-link a {
        color: #a78bfa;
        text-decoration: none;
        font-weight: 600;
    }

    .bottom-link a:hover { color: #c4b5fd; text-decoration: underline; }

    @media (max-width: 700px) {
        nav { padding: 14px 6%; }
        .main { padding: 40px 6%; }
        .form-card { padding: 32px 24px; }
        .form-card h1 { font-size: 24px; }
        .row { grid-template-columns: 1fr; gap: 0; }
    }
</style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">Repair<span>Shop</span></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
</nav>

<div class="main">
    <div class="form-card">
        <h1>Create Your <span>Account</span></h1>
        <p class="subtitle">Register to unlock full access to Learn More</p>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <form id="registerForm" autocomplete="off">
            <div class="field">
                <label>Full Name <span>*</span></label>
                <input type="text" id="fullName" placeholder="Juan Dela Cruz" required>
            </div>

            <div class="row">
                <div class="field">
                    <label>Username <span>*</span></label>
                    <input type="text" id="username" placeholder="juandc" required minlength="4">
                </div>
                <div class="field">
                    <label>Email <span>*</span></label>
                    <input type="email" id="email" placeholder="juan@email.com" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Contact Number <span>*</span></label>
                    <input type="text" id="contact" placeholder="09171234567" required>
                </div>
                <div class="field">
                    <label>Password <span>*</span></label>
                    <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
                </div>
            </div>

            <div class="field">
                <label>Address <span>*</span></label>
                <textarea id="address" placeholder="123 Mabini St., Manila" required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Register Now</button>
        </form>

        <p class="bottom-link">
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');

    const fullName = document.getElementById('fullName').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const password = document.getElementById('password').value;
    const address = document.getElementById('address').value.trim();

    // Basic client-side validation (server will re-validate)
    const errors = [];
    if (fullName.length < 3) errors.push('Full name must be at least 3 characters.');
    if (username.length < 4) errors.push('Username must be at least 4 characters.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.push('Please enter a valid email.');
    if (contact.length < 7) errors.push('Please enter a valid contact number.');
    if (password.length < 6) errors.push('Password must be at least 6 characters.');
    if (address.length < 5) errors.push('Please enter a complete address.');

    if (errors.length > 0) {
        errorMsg.innerHTML = errors.join('<br>');
        errorMsg.classList.add('show');
        return;
    }

    submitBtn.textContent = 'Creating your account...';
    submitBtn.disabled = true;

    try {
        const res = await fetch('/netlify/functions/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                full_name: fullName,
                username: username,
                email: email,
                contact: contact,
                password: password,
                address: address
            })
        });

        const data = await res.json();

        if (!res.ok) {
            errorMsg.innerHTML = data.error || 'Registration failed.';
            errorMsg.classList.add('show');
            submitBtn.textContent = 'Register Now';
            submitBtn.disabled = false;
            return;
        }

        // Save session
        sessionStorage.setItem('repairshop_logged_in', 'true');
        sessionStorage.setItem('repairshop_current_user', JSON.stringify(data.user));

        successMsg.innerHTML = '✓ Account created! Redirecting to Learn More...';
        successMsg.classList.add('show');

        setTimeout(() => {
            window.location.href = 'learn-more.html';
        }, 1200);

    } catch (err) {
        errorMsg.innerHTML = 'Network error. Please try again.';
        errorMsg.classList.add('show');
        submitBtn.textContent = 'Register Now';
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
