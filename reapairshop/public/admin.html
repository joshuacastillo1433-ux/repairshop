<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User record — RepairShop</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        color: #e5e7eb;
        background: #1e1b4b;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    nav {
        position: sticky;
        top: 0;
        background: rgba(30, 27, 75, 0.85);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        padding: 16px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
    }

    .logo {
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .logo span { color: #a78bfa; }
    .logo::before { content: "🔧"; font-size: 24px; }

    .nav-links {
        display: flex;
        gap: 26px;
        align-items: center;
        list-style: none;
    }

    .nav-links a {
        color: #c4b5fd;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        transition: color 0.2s;
    }

    .nav-links a:hover { color: #ffffff; }

    .main {
        flex: 1;
        padding: 50px 8%;
        background: radial-gradient(ellipse at top right, #3b2d7a 0%, transparent 55%),
                    radial-gradient(ellipse at bottom left, #312e81 0%, transparent 55%),
                    linear-gradient(135deg, #1e1b4b 0%, #2e1065 100%);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 32px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
    }

    .header h1 span {
        background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .header .badge {
        display: inline-block;
        background: rgba(139, 92, 246, 0.2);
        color: #c4b5fd;
        padding: 8px 18px;
        border-radius: 30px;
        font-size: 13.5px;
        font-weight: 600;
        border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: rgba(30, 27, 75, 0.6);
        border: 1px solid rgba(139, 92, 246, 0.25);
        border-radius: 18px;
        padding: 24px;
        backdrop-filter: blur(16px);
        transition: all 0.25s;
    }

    .stat-card:hover {
        transform: translateY(-4px);
        border-color: rgba(139, 92, 246, 0.5);
        box-shadow: 0 12px 32px rgba(139, 92, 246, 0.2);
    }

    .stat-card .lbl {
        font-size: 12.5px;
        font-weight: 700;
        color: #a5b4fc;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
    }

    .stat-card .num {
        font-size: 34px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.2;
    }

    .stat-card .num.purple {
        background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .table-panel {
        background: rgba(30, 27, 75, 0.6);
        border: 1px solid rgba(139, 92, 246, 0.25);
        border-radius: 20px;
        padding: 26px;
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    .table-panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 20px;
        padding-bottom: 18px;
        border-bottom: 1px solid rgba(139, 92, 246, 0.2);
    }

    .table-panel-head h2 {
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
    }

    .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .btn {
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-family: inherit;
        transition: all 0.25s;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(139, 92, 246, 0.6);
    }

    .btn-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover {
        background: rgba(239, 68, 68, 0.25);
        color: #ffffff;
    }

    .btn-small {
        padding: 6px 14px;
        font-size: 12px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    table th {
        text-align: left;
        padding: 12px 10px;
        color: #a5b4fc;
        font-weight: 700;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 2px solid rgba(139, 92, 246, 0.25);
    }

    table td {
        padding: 14px 10px;
        border-bottom: 1px solid rgba(139, 92, 246, 0.1);
        color: #e5e7eb;
    }

    table tr:hover td {
        background: rgba(139, 92, 246, 0.06);
    }

    table td.code {
        font-family: 'Courier New', monospace;
        color: #a78bfa;
        font-weight: 600;
    }

    table td.name {
        color: #ffffff;
        font-weight: 600;
    }

    .badge-status {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .badge-active {
        background: rgba(16, 185, 129, 0.15);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #a5b4fc;
    }

    .empty-state .icon { font-size: 60px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 20px; color: #ffffff; margin-bottom: 8px; font-weight: 700; }
    .empty-state p { font-size: 14px; margin-bottom: 20px; }

    @media (max-width: 800px) {
        nav { padding: 14px 6%; }
        .main { padding: 30px 6%; }
        .header h1 { font-size: 24px; }
        table { font-size: 12.5px; }
        table th, table td { padding: 10px 6px; }
        .table-panel { padding: 16px; }
    }
</style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">Repair<span>Shop</span></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
    </ul>
</nav>

<div class="main">

    <div class="header">
        <h1>User <span>Info</span></h1>
        <span class="badge" id="lastUpdate">Live data</span>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="lbl">Total Registered</div>
            <div class="num purple" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="lbl">Active Accounts</div>
            <div class="num" id="statActive">0</div>
        </div>
        <div class="stat-card">
            <div class="lbl">New Today</div>
            <div class="num" id="statToday">0</div>
        </div>
    </div>

    <div class="table-panel">
        <div class="table-panel-head">
            <h2>📋 Registered Customers</h2>
            <div class="actions">
                <button class="btn btn-primary" onclick="loadUsers()">↻ Refresh</button>
                <button class="btn btn-danger" onclick="clearAll()">🗑 Clear All</button>
            </div>
        </div>

        <div id="tableArea"></div>
    </div>

</div>

<script>
let ADMIN_PASSWORD = null;

async function askPassword() {
    // Ask once per session
    ADMIN_PASSWORD = sessionStorage.getItem('admin_pass');
    if (ADMIN_PASSWORD) return true;

    const entered = prompt('Enter admin password:');
    if (!entered) return false;

    ADMIN_PASSWORD = entered;
    sessionStorage.setItem('admin_pass', entered);
    return true;
}

async function loadUsers() {
    if (!await askPassword()) return;

    try {
        const res = await fetch('/netlify/functions/list-users', {
            headers: { 'x-admin-password': ADMIN_PASSWORD }
        });

        if (res.status === 401) {
            sessionStorage.removeItem('admin_pass');
            alert('Incorrect admin password. Reloading...');
            location.reload();
            return;
        }

        const data = await res.json();
        const users = data.users || [];

        document.getElementById('statTotal').textContent = users.length;
        document.getElementById('statActive').textContent = users.filter(u => u.status === 'Active').length;

        const today = new Date().toDateString();
        document.getElementById('statToday').textContent = users.filter(u => {
            return new Date(u.registered_at).toDateString() === today;
        }).length;

        document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();

        const tableArea = document.getElementById('tableArea');

        if (users.length === 0) {
            tableArea.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <h3>No registrations yet</h3>
                    <p>When customers register, they will appear here.</p>
                    <a href="register.html" class="btn btn-primary">Register a Customer</a>
                </div>
            `;
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Contact</th>
                        <th>Registered</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
        `;

        users.slice().reverse().forEach(u => {
            const d = new Date(u.registered_at);
            html += `
                <tr>
                    <td class="code">${u.customer_code}</td>
                    <td class="name">${escapeHtml(u.full_name)}</td>
                    <td>${escapeHtml(u.username)}</td>
                    <td>${escapeHtml(u.email)}</td>
                    <td>${escapeHtml(u.contact)}</td>
                    <td>${d.toLocaleString()}</td>
                    <td><span class="badge-status badge-active">${u.status}</span></td>
                    <td>
                        <button class="btn btn-danger btn-small" onclick="deleteUser(${u.id})">Delete</button>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        tableArea.innerHTML = html;

    } catch (err) {
        document.getElementById('tableArea').innerHTML =
            '<p style="text-align:center;color:#fca5a5;">Failed to load users.</p>';
    }
}

async function deleteUser(id) {
    if (!confirm('Delete this user?')) return;

    try {
        const res = await fetch('/netlify/functions/delete-user', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-admin-password': ADMIN_PASSWORD
            },
            body: JSON.stringify({ id })
        });

        const data = await res.json();
        if (data.success) {
            loadUsers();
        } else {
            alert('Delete failed.');
        }
    } catch (err) {
        alert('Network error.');
    }
}

function clearAll() {
    alert('To clear all users, delete them individually.');
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

loadUsers();
</script>

</body>
</html>
